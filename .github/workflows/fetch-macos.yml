name: Fetch macOS preview
on:
  workflow_dispatch:
  push:
    branches: [macos-preview]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-fetch.txt pyinstaller==6.22.3
      - name: Test downloader and updater
        run: |
          python -m unittest discover -s tests -p 'test_media_downloader.py'
          python -m unittest discover -s tests -p 'test_instagram_downloads.py'
          python -m unittest discover -s tests -p 'test_macos_support.py'
      - name: Build and test app
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: python packaging/build_fetch_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fetch-macOS-${{ matrix.arch }}-preview
          path: |
            release/macos/*
            build/macos/Fetch-ui.png
          if-no-files-found: error
